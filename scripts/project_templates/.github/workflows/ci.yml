name: Workflow configuration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    name: Workflow configuration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/validate_starter.py --project
